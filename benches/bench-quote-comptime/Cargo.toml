[package]
name = "bench-quote-comptime"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
quote = { version = "1", optional = true }
unsynn = { version = "0.3", optional = true, default-features = false, features = ["proc_macro2"] }
parsyng-core = { path = "../../crates/parsyng-core", optional = true }

[features]
quote = ["dep:quote"]
unsynn = ["dep:unsynn"]
parsyng-core = ["dep:parsyng-core"]
proc-macro2 = ["parsyng-core/proc-macro2"]

empty = []
small = []
big = []
