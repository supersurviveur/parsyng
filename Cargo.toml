[workspace]
resolver = "3"
members = [
  "crates/parsyng-quote-macros",
  "crates/parsyng-proc-macros",
  "crates/parsyng-quote",
  "crates/parsyng-quote/benches/bench-comptime",
  "examples/simple-use",
  "examples/simple-use-macros",
]

[package]
name = "parsyng"
version = "0.1.0"
edition = "2024"
license = "MIT"
readme = "README.md"
keywords = ["macros", "proc"]
categories = ["development-tools::procedural-macro-helpers"]

[dependencies]
parsyng-proc-macros = { path = "./crates/parsyng-proc-macros" }
parsyng-quote = { path = "./crates/parsyng-quote" }
unicode-ident = "1"

# Optional dependencies
proc-macro2 = { version = "1", optional = true }

[features]
proc-macro2 = ["dep:proc-macro2", "parsyng-quote/proc-macro2"]
debug-pretty = []
